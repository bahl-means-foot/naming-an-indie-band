<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>우리를 밟으면 사랑에 빠지리...</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      width: 100vw;
      height: 100vh;

      display: flex;
      justify-content: center;
      align-items: center;

      background: #ffffff;
      overflow: hidden;

      /* 입체적인 회전을 위한 원근감 */
      perspective: 900px;
    }

    .square {
      position: relative;

      width: 320px;
      height: 320px;

      background: #f4f1eb;
      border: 1px solid #dedbd5;

      box-shadow:
        0 8px 18px rgba(0, 0, 0, 0.06),
        0 22px 50px rgba(0, 0, 0, 0.08);

      transform-style: preserve-3d;

      transition:
        transform 0.45s cubic-bezier(.2, .8, .2, 1),
        box-shadow 0.45s ease;

      cursor: pointer;
    }

    .square:hover {
      transform:
        rotateX(5deg)
        rotateY(-7deg)
        rotateZ(1deg)
        translateY(-4px);

      box-shadow:
        8px 14px 24px rgba(0, 0, 0, 0.07),
        18px 32px 60px rgba(0, 0, 0, 0.10);
    }

    .circular-text {
      position: absolute;

      width: 76%;
      height: 76%;

      left: 50%;
      top: 50%;

      transform:
        translate(-50%, -50%)
        translateZ(15px);

      overflow: visible;
    }

    .circular-text text {
      fill: #d51d18;

      font-family:
        "Noto Serif KR",
        "Nanum Myeongjo",
        serif;

      font-size: 17px;
      font-weight: 500;

      letter-spacing: 1.2px;
    }
  </style>
</head>

<body>

  <div class="square">

    <svg
      class="circular-text"
      viewBox="0 0 250 250"
      aria-label="우리를 밟으면 사랑에 빠지리"
    >

      <defs>
        <!--
          원형 텍스트가 따라갈 경로.
          중앙 (125,125), 반지름 83
        -->
        <path
          id="text-circle"
          d="
            M 125,42
            A 83,83 0 1,1 124.9,42
          "
        />
      </defs>

      <text>
        <textPath
          href="#text-circle"
          startOffset="0%"
        >
          우리를 밟으면 사랑에 빠지리... ·
          우리를 밟으면 사랑에 빠지리... ·
          우리를 밟으면 사랑에 빠지리... ·
        </textPath>
      </text>

    </svg>

  </div>

</body>
</html>
